# Evelyn Clínica Estética — Supabase local (V3 foundation)
# Canonical A1: organizations / staff_profiles / RBAC / patients / audit_logs
# No remote credentials in-repo. Docs: docs/SCHEMA_FOUNDATION_A1.md
# https://supabase.com/docs/guides/cli/config

[project]
id = "evelyn-v3-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Do NOT change until confirmed against remote evelyn-v3:
#   SELECT version();  -- or: SHOW server_version;
# Local A1 harness validated on PostgreSQL 16; this local CLI default remains 15
# until the remote major is verified. SQL is written to be compatible with both.
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[analytics]
enabled = false
